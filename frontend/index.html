<title>Ишлаб чиқариш маркази</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>{{include:styles.css}}</style>

<div class="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img src="data:image/png;base64,{{base64:assets/logo.png}}" alt="Сандал" style="width:26px; height:26px; object-fit:contain; display:block;">
      </div>
      <div class="brand-text">
        <div class="brand-word">Ишлаб чиқариш</div>
        <div class="brand-sub">Бошқарув маркази</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="theme-row"><span id="dbStatusLabel">Уланмоқда…</span></div>
      <div style="margin-top:8px;"><button class="btn btn-ghost btn-sm" id="loginToggleBtn" style="width:100%;justify-content:center;padding:7px;"></button></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" aria-label="Меню">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 id="pageTitle">Бошқарув панели</h1>
          <div class="topbar-sub" id="pageSub"></div>
        </div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>
<div class="bar-tooltip" id="barTooltip"></div>
<div id="printArea"></div>

<script>{{js}}</script>
