name: santal

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-santal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida ko'rsatilmagan}
      POSTGRES_DB: ${POSTGRES_DB:-santal}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: santal-app
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      WEBHOOK_PORT: "8443"
    ports:
      # Дастур (саҳифа + API). APP_BIND — қайси IP'да очилади (масалан VPN IP'си);
      # интернетга очиқ серверда .env'да APP_PASSWORD бўлиши шарт.
      - "${APP_BIND:-0.0.0.0}:${PORT:-8642}:${PORT:-8642}"
      # Фақат Telegram webhook (WEBHOOK_URL берилганда); бу портда бошқа ҳеч нарса йўқ
      - "${WEBHOOK_PUBLIC_PORT:-8443}:8443"
    volumes:
      - ./baza:/app/baza
      - ./certs:/app/certs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % (os.environ.get('PORT') or '8642'), timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  pgdata:
