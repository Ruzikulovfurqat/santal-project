name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Frontend йиғилиши
        run: python frontend_build.py dist/app.html

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: santal
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: santal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U santal -d santal"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: santal
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: santal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            bot/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Тестлар
        run: python -m pytest -v tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: .env (CI учун)
        run: sed "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env.example > .env
      - name: Docker compose — йиғиш ва ишга тушириш
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Соғлиқ текшируви
        run: |
          curl -fsS http://127.0.0.1:8642/healthz
          # Аввал файлга: "curl | grep -q" pipefail билан curl'ни (23) йиқитади
          curl -fsS -o page.html http://127.0.0.1:8642/
          grep -q "window.claude.use" page.html
          docker compose exec -T app python -c "import pgstore; assert pgstore.col_list('items')"
      - name: Лог (хато бўлса)
        if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v

  deploy:
    needs: [lint, test, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Созламаларни текшириш
        id: cfg
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy ўтказиб юборилди — GitHub secrets'да йўқ:$missing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.enabled == 'true'

      - name: SSH калити
        if: steps.cfg.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS йўқ — сервер калити ssh-keyscan орқали олинди"
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          # ControlMaster: барча ssh/rsync буйруқлари БИТТА уланишдан ўтади —
          # серверда ufw limit / fail2ban бўлса, кетма-кет уланишлар блокланмайди
          printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%C\n  ControlPersist 10m\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" > ~/.ssh/config

      - name: Кодни серверга юклаш
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          ssh deploy "mkdir -p '$DEPLOY_PATH/baza/uploads'"
          # Код: --delete эски файлларни ўчиради, лекин пастдаги истисноларга ҳеч қачон тегмайди
          rsync -az --delete \
            --exclude=.git/ --exclude=.github/ --exclude=.venv/ --exclude=tests/ \
            --exclude=.env --exclude=baza/ --exclude=certs/ --exclude=backups/ --exclude=dist/ \
            --exclude=__pycache__/ --exclude='*.pyc' --exclude=bot/bot.db \
            ./ "deploy:$DEPLOY_PATH/"
          # baza/: фақат серверда ЙЎҚ файллар қўшилади (биринчи deploy учун), борлари ўзгармайди
          rsync -az --ignore-existing baza/ "deploy:$DEPLOY_PATH/baza/"

      - name: Ишга тушириш
        if: steps.cfg.outputs.enabled == 'true'
        run: ssh deploy "bash '$DEPLOY_PATH/scripts/deploy.sh'"
